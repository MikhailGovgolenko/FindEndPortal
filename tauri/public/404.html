<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>FindEndPortal</title>
    <script type="text/javascript">
      (function() {
        var l = window.location;
        // GitHub Pages отдаёт 404.html для любого несуществующего пути.
        // Т.к. это одностраничное приложение, просто редиректим на корень.
        if (l.pathname !== '/' && l.pathname !== '/index.html') {
          l.replace(l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') + '/');
        }
      })();
    </script>
  </head>
  <body>
    <!-- Fallback для случая если JS отключен -->
    <noscript>
      <meta http-equiv="refresh" content="0; url=/">
    </noscript>
  </body>
</html>
