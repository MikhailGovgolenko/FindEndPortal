<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />

        <!-- Оставляем только фавикон для вкладки браузера -->
        <link rel="icon" type="image/png" href="/favicon-v2.png" />

        <!-- Манифест, который теперь полностью управляет иконкой на экране Домой -->
        <link rel="manifest" href="/manifest.webmanifest" />

        <!-- Canonical для нового custom domain -->
        <link rel="canonical" href="https://findendportal.govgolenko.ru/" />

        <!-- PWA мета теги -->
        <meta name="application-name" content="FindEndPortal" />
        <meta name="apple-mobile-web-app-capable" content="yes" />
        <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
        <meta name="apple-mobile-web-app-title" content="FindEndPortal" />
        <meta name="mobile-web-app-capable" content="yes" />
        <meta name="supported-color-schemes" content="light dark" />

        <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />

        <title>FindEndPortal</title>

        <!-- Description -->
        <meta
            name="description"
            content="Tool for locating Minecraft strongholds from Eye of Ender throws"
        />

        <!-- Open Graph -->
        <meta property="og:title" content="FindEndPortal" />
        <meta property="og:site_name" content="FindEndPortal" />
        <meta
            property="og:description"
            content="Tool for locating Minecraft strongholds from Eye of Ender throws."
        />
        <meta
            property="og:image"
            content="https://findendportal.govgolenko.ru/preview.png"
        />
        <meta
            property="og:url"
            content="https://findendportal.govgolenko.ru/"
        />
        <meta property="og:type" content="website" />
    </head>

    <body>
        <div id="root"></div>
        <script type="module" src="/src/main.tsx"></script>

        <!-- Register Service Worker for PWA support -->
        <script>
            if ("serviceWorker" in navigator) {
                navigator.serviceWorker
                    .register("/sw.js?v=3", {
                        scope: "/",
                    })
                    .then((reg) => {
                        reg.update();
                    })
                    .catch((err) =>
                        console.warn("SW registration failed:", err),
                    );
            }
        </script>
    </body>
</html>
