name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main # Твоя главная ветка

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # 1. Устанавливаем pnpm ПЕРЕД настройкой Node.js
      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9 # или актуальная твоя версия pnpm

      # 2. Настраиваем Node.js (перешли на Node 24, так как 20 депрекейтнут)
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: "pnpm" # Теперь кэш pnpm отработает без ошибок

      - name: Install dependencies
        run: pnpm install

      - name: Build frontend
        run: pnpm run build

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "./dist"

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
