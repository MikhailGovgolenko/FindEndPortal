<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        
        <!-- Favicon и иконки (Добавили жесткий cache busting ?v=2) -->
        <link rel="icon" type="image/png" href="/FindEndPortal/favicon.png?v=2" />
        <link rel="apple-touch-icon" href="/FindEndPortal/apple-touch-icon.png?v=2" />
        
        <!-- Web App Manifest (Манифесту тоже обновляем версию) -->
        <link rel="manifest" href="/FindEndPortal/manifest.webmanifest?v=2" />
        
        <!-- PWA мета теги -->
        <meta name="application-name" content="FindEndPortal" />
        <meta name="apple-mobile-web-app-capable" content="yes" />
        <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
        <meta name="apple-mobile-web-app-title" content="FindEndPortal" />
        <meta name="mobile-web-app-capable" content="yes" />
        <meta name="supported-color-schemes" content="light dark" />
        
        <!-- Viewport -->
        <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
        
        <title>FindEndPortal</title>
    </head>

    <body>
        <div id="root"></div>
        <script type="module" src="/src/main.tsx"></script>
    
        <!-- Register Service Worker for PWA support -->
        <script>
          if ('serviceWorker' in navigator) {
            // Добавляем ?v=2 к скрипту сервис-воркера. 
            // Браузер увидит изменение строки, принудительно переустановит sw.js и очистит старый кэш картинок!
            navigator.serviceWorker.register('/FindEndPortal/sw.js?v=2', {
              scope: '/FindEndPortal/'
            }).then(reg => {
              // Если воркер обновился, заставляем его сразу активироваться
              reg.update();
            }).catch(err => console.warn('SW registration failed:', err));
          }
        </script>
    </body>
</html>
